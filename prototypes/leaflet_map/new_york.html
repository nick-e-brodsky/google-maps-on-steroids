<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>new_york - Leaflet prototype</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NYC Map">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .filters {
    background: white; padding: 10px 12px; border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 13px; line-height: 1.5;
    max-height: 60vh; overflow-y: auto; width: 220px; max-width: calc(100vw - 20px);
  }
  .filters h4 { margin: 4px 0 4px; font-size: 12px; text-transform: uppercase;
    color: #555; display: flex; justify-content: space-between; align-items: center; }
  .filters .toggle-all { font-size: 11px; font-weight: normal; text-transform: none;
    color: #2980b9; cursor: pointer; text-decoration: underline; }
  .filters label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .filters .swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none;
  }
  .filters hr { border: none; border-top: 1px solid #ddd; margin: 8px 0; }
  .stats { font-size: 12px; color: #333; margin-bottom: 4px; }
  .stats.failed { color: #888; margin-bottom: 8px; }
  .popup-link { display: inline-block; margin-top: 4px; }
  .filters-toggle { display: none; cursor: pointer; font-weight: 600; align-items: center;
    justify-content: space-between; gap: 8px; }
  .filters-toggle .chevron { font-size: 10px; transition: transform 0.15s; }
  @media (max-width: 600px) {
    .filters-toggle { display: flex; }
    .filters.collapsed { width: auto; max-height: none; }
    .filters.collapsed .filters-body { display: none; }
    .filters:not(.collapsed) .filters-toggle .chevron { transform: rotate(180deg); }
    .filters:not(.collapsed) .filters-toggle { margin-bottom: 6px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
  const places = [{"title": "56 Bogart St", "lat": 40.705865, "lon": -73.9331729, "category": "Arts/Studios/Event Spaces", "neighborhood": "Brooklyn", "cuisine": "", "url": "https://www.google.com/maps/place/56+Bogart+St/data=!4m2!3m1!1s0x89c25c00fe4119ad:0x80bfea2c85bf1071"}, {"title": "Brooklyn Brush Studios", "lat": 40.7077362, "lon": -73.9252355, "category": "Arts/Studios/Event Spaces", "neighborhood": "Bushwick", "cuisine": "", "url": "https://www.google.com/maps/place/Brooklyn+Brush+Studios/data=!4m2!3m1!1s0x89c25ea8030cba1f:0xe42263c9b41eb7ff"}, {"title": "EDEN (Eden Gallery) - SoHo", "lat": 40.7226991, "lon": -74.0014366, "category": "Galleries", "neighborhood": "Little Italy", "cuisine": "", "url": "https://www.google.com/maps/place/EDEN+(Eden+Gallery)+-+SoHo/data=!4m2!3m1!1s0x89c2598bf0b2abfb:0x1b3d2bffdb898257"}, {"title": "EDEN", "lat": 40.8443436, "lon": -73.9147452, "category": "Other/Uncategorized", "neighborhood": "The Bronx", "cuisine": "", "url": "https://www.google.com/maps/place/EDEN/data=!4m2!3m1!1s0x89c259dd7a4a8c93:0x7c2b3dc079b739b4"}, {"title": "Eli Klein Gallery", "lat": 40.7334131, "lon": -74.00988319999999, "category": "Galleries", "neighborhood": "West Village", "cuisine": "", "url": "https://www.google.com/maps/place/Eli+Klein+Gallery/data=!4m2!3m1!1s0x89c2598e75fce01f:0x599ea1d809ebd78b"}, {"title": "Eric Firestone Gallery", "lat": 40.7269555, "lon": -73.9926816, "category": "Galleries", "neighborhood": "NoHo", "cuisine": "", "url": "https://www.google.com/maps/place/Eric+Firestone+Gallery/data=!4m2!3m1!1s0x89c2599abb1f6e61:0xc572f82c6f4568f7"}, {"title": "Hall des Lumi\u00e8res", "lat": 40.713744, "lon": -74.005072, "category": "Museums/Cultural Institutions", "neighborhood": "Civic Center", "cuisine": "", "url": "https://www.google.com/maps/place/Hall+des+Lumi%C3%A8res/data=!4m2!3m1!1s0x89c25bc6f59bb035:0xd3737b4399aaac7f"}, {"title": "Jeffrey Deitch", "lat": 40.7219434, "lon": -74.002655, "category": "Galleries", "neighborhood": "Little Italy", "cuisine": "", "url": "https://www.google.com/maps/place/Jeffrey+Deitch/data=!4m2!3m1!1s0x89c2598baf3f6075:0x882ac0d144e4013e"}, {"title": "Klom Klorm", "lat": 40.7031166, "lon": -73.9170639, "category": "Dining", "neighborhood": "Bushwick", "cuisine": "Thai", "url": "https://www.google.com/maps/place/Klom+Klorm/data=!4m2!3m1!1s0x89c25d6d41e21593:0x94c6ae1d6f2e1176"}, {"title": "Moonzescope", "lat": 40.72023, "lon": -73.99976699999999, "category": "Other/Uncategorized", "neighborhood": "Little Italy", "cuisine": "", "url": "https://www.google.com/maps/place/Moonzescope/data=!4m2!3m1!1s0x89c2595ebc6f5f2d:0x4fa08e86c64e7d6f"}, {"title": "RAINRAIN", "lat": 40.7182678, "lon": -74.0008737, "category": "Other/Uncategorized", "neighborhood": "Little Italy", "cuisine": "", "url": "https://www.google.com/maps/place/RAINRAIN/data=!4m2!3m1!1s0x89c25973072b6709:0x7982b2c3116b5898"}, {"title": "Ronald Feldman Gallery", "lat": 40.7210659, "lon": -74.0017338, "category": "Galleries", "neighborhood": "Little Italy", "cuisine": "", "url": "https://www.google.com/maps/place/Ronald+Feldman+Gallery/data=!4m2!3m1!1s0x89c2598bc959625d:0x9164352bc5305938"}, {"title": "TF Chen Cultural Center", "lat": 40.7195162, "lon": -73.9992154, "category": "Museums/Cultural Institutions", "neighborhood": "Little Italy", "cuisine": "", "url": "https://www.google.com/maps/place/TF+Chen+Cultural+Center/data=!4m2!3m1!1s0x89c2598f2fa35d93:0xf18bd4d16f0b89a8"}, {"title": "Tabar\u00e9 Bushwick", "lat": 40.7038002, "lon": -73.93073, "category": "Dining", "neighborhood": "Bushwick", "cuisine": "Uruguayan", "url": "https://www.google.com/maps/place/Tabar%C3%A9+Bushwick/data=!4m2!3m1!1s0x89c25d44cc8e45f3:0x196703290192315e"}, {"title": "The Active Space", "lat": 40.7086966, "lon": -73.9255053, "category": "Other/Uncategorized", "neighborhood": "Bushwick", "cuisine": "", "url": "https://www.google.com/maps/place/The+Active+Space/data=!4m2!3m1!1s0x89c25ea8402c70bf:0x5a989c05144a5474"}, {"title": "The Bushwick Collective", "lat": 40.7075174, "lon": -73.9221845, "category": "Arts/Studios/Event Spaces", "neighborhood": "Bushwick", "cuisine": "", "url": "https://www.google.com/maps/place/The+Bushwick+Collective/data=!4m2!3m1!1s0x89c25f8a658ad267:0xea3dfc8a4484947d"}, {"title": "WORTHLESSSTUDIOS", "lat": 40.7076408, "lon": -73.9313437, "category": "Arts/Studios/Event Spaces", "neighborhood": "Bushwick", "cuisine": "", "url": "https://www.google.com/maps/place/WORTHLESSSTUDIOS/data=!4m2!3m1!1s0x89c25d3468585fef:0x823960b90bbc1e7e"}, {"title": "Z\u00fcrcher Gallery", "lat": 40.7257429, "lon": -73.99380239999999, "category": "Galleries", "neighborhood": "NoHo", "cuisine": "", "url": "https://www.google.com/maps/place/Z%C3%BCrcher+Gallery/data=!4m2!3m1!1s0x89c2598569e3ccd7:0x30d6706ec6b3b8c"}];
  const colors = {"Dining": "#e74c3c", "Coffee/Bakery": "#935116", "Bars/Nightlife": "#8e44ad", "Galleries": "#2980b9", "Museums/Cultural Institutions": "#16a085", "Arts/Studios/Event Spaces": "#d35400", "Shops/Retail": "#f1c40f", "Parks/Outdoors": "#27ae60", "Other/Uncategorized": "#7f8c8d"};
  const totalPlotted = 18;
  const failedCount = 0;

  const categories = [...new Set(places.map(p => p.category))].sort();
  const neighborhoods = [...new Set(places.map(p => p.neighborhood).filter(Boolean))].sort();
  const cuisines = [...new Set(places.map(p => p.cuisine).filter(Boolean))].sort();

  const map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  const clusterGroup = L.markerClusterGroup();
  clusterGroup.addTo(map);

  const activeCategories = new Set(categories);
  const activeNeighborhoods = new Set(neighborhoods);
  const activeCuisines = new Set(cuisines);

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  const markers = places.map(p => {
    const color = colors[p.category] || '#333';
    const marker = L.circleMarker([p.lat, p.lon], {
      radius: 7, color: color, fillColor: color, fillOpacity: 0.85, weight: 1,
    });
    const cuisineLine = p.cuisine ? `<br>${escapeHtml(p.cuisine)} cuisine` : '';
    const mapsLink = p.url
      ? `<br><a class="popup-link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">View on Google Maps</a>`
      : '';
    marker.bindPopup(`<b>${escapeHtml(p.title)}</b><br>${escapeHtml(p.category)}${cuisineLine}<br>${escapeHtml(p.neighborhood || '')}${mapsLink}`);
    return { marker, place: p };
  });

  // Cuisine only applies to places that have one (Dining) - a place with no
  // cuisine value is never hidden by the cuisine filter.
  function applyFilters() {
    const bounds = [];
    markers.forEach(({ marker, place }) => {
      const visible = activeCategories.has(place.category) &&
        (place.neighborhood === '' || activeNeighborhoods.has(place.neighborhood)) &&
        (place.cuisine === '' || activeCuisines.has(place.cuisine));
      if (visible) {
        if (!clusterGroup.hasLayer(marker)) clusterGroup.addLayer(marker);
        bounds.push([place.lat, place.lon]);
      } else if (clusterGroup.hasLayer(marker)) {
        clusterGroup.removeLayer(marker);
      }
    });
    return bounds;
  }

  function refresh() {
    const bounds = applyFilters();
    const statsEl = document.getElementById('stats-count');
    if (statsEl) statsEl.textContent = `Showing ${bounds.length} of ${totalPlotted} places`;
    if (bounds.length) { map.fitBounds(bounds, { padding: [30, 30] }); }
    else { map.setView([40.7128, -74.0060], 12); }
  }

  function buildFilterGroup(title, items, activeSet, colorFor) {
    const div = L.DomUtil.create('div');
    const header = L.DomUtil.create('h4', '', div);
    header.innerHTML = `<span>${title}</span>`;
    const toggle = L.DomUtil.create('span', 'toggle-all', header);
    toggle.textContent = 'All / None';
    toggle.onclick = () => {
      const allOn = items.every(i => activeSet.has(i));
      items.forEach(i => allOn ? activeSet.delete(i) : activeSet.add(i));
      div.querySelectorAll('input').forEach(cb => cb.checked = !allOn);
      refresh();
    };
    items.forEach(item => {
      const label = L.DomUtil.create('label', '', div);
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.onchange = () => {
        if (cb.checked) activeSet.add(item); else activeSet.delete(item);
        refresh();
      };
      label.appendChild(cb);
      if (colorFor) {
        const sw = L.DomUtil.create('span', 'swatch', label);
        sw.style.background = colorFor(item);
      }
      label.appendChild(document.createTextNode(item));
    });
    return div;
  }

  const filterControl = L.control({ position: 'topright' });
  filterControl.onAdd = function() {
    // Starts collapsed; only the media query above hides the body, so this
    // is a no-op above 600px and the panel stays always-expanded there.
    const div = L.DomUtil.create('div', 'filters collapsed');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);

    const toggle = L.DomUtil.create('div', 'filters-toggle', div);
    L.DomUtil.create('span', '', toggle).textContent = 'Filters';
    L.DomUtil.create('span', 'chevron', toggle).textContent = '▾';
    toggle.onclick = () => div.classList.toggle('collapsed');

    const body = L.DomUtil.create('div', 'filters-body', div);
    const stats = L.DomUtil.create('div', 'stats', body);
    stats.id = 'stats-count';
    stats.textContent = `Showing ${totalPlotted} of ${totalPlotted} places`;
    if (failedCount > 0) {
      const failedLine = L.DomUtil.create('div', 'stats failed', body);
      failedLine.textContent = `${failedCount} more failed to geocode (not shown)`;
    }
    body.appendChild(document.createElement('hr'));
    body.appendChild(buildFilterGroup('Category', categories, activeCategories, c => colors[c] || '#333'));
    body.appendChild(document.createElement('hr'));
    body.appendChild(buildFilterGroup('Neighborhood', neighborhoods, activeNeighborhoods, null));
    if (cuisines.length) {
      body.appendChild(document.createElement('hr'));
      body.appendChild(buildFilterGroup('Cuisine', cuisines, activeCuisines, null));
    }
    return div;
  };
  filterControl.addTo(map);

  refresh();
</script>
</body>
</html>
