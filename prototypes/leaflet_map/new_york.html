99999, "category": "Coffee/Bakery", "neighborhood": "Bushwick", "cuisine": "", "url": "https://www.google.com/maps/place/Werkshop+Coffee+Co./data=!4m2!3m1!1s0x89c25d381844d807:0x42d10cb85bf4aef2"}, {"title": "Westbeth Artists Housing and Center for the Arts", "lat": 40.7367551, "lon": -74.00968209999999, "category": "Other/Uncategorized", "neighborhood": "Meatpacking District", "cuisine": "", "url": "https://www.google.com/maps/place/Westbeth+Artists+Housing+and+Center+for+the+Arts/data=!4m2!3m1!1s0x89c259ea54c99377:0x32a8d2778a3137c5"}, {"title": "What Mary Kept", "lat": 40.7036243, "lon": -73.9263952, "category": "Other/Uncategorized", "neighborhood": "Bushwick", "cuisine": "", "url": "https://www.google.com/maps/place/What+Mary+Kept/data=!4m2!3m1!1s0x89c25d0881369f87:0xc648e3ac2fc84f80"}, {"title": "Whitney Museum of American Art", "lat": 40.7396451, "lon": -74.008921, "category": "Museums/Cultural Institutions", "neighborhood": "Meatpacking District", "cuisine": "", "url": "https://www.google.com/maps/place/Whitney+Museum+of+American+Art/data=!4m2!3m1!1s0x89c25894ea097337:0xc63f52f9d53d7889"}, {"title": "Wiggle Room", "lat": 40.7226149, "lon": -73.9862173, "category": "Bars/Nightlife", "neighborhood": "Alphabet City", "cuisine": "", "url": "https://www.google.com/maps/place/Wiggle+Room/data=!4m2!3m1!1s0x89c259a796fa9577:0x5e02a9542df83499"}, {"title": "Wildair", "lat": 40.7200045, "lon": -73.9891428, "category": "Dining", "neighborhood": "Lower East Side", "cuisine": "", "url": "https://www.google.com/maps/place/Wildair/data=!4m2!3m1!1s0x89c25a29d0319b7d:0x68b27fd63118d308"}, {"title": "Wonderville", "lat": 40.6924111, "lon": -73.9275164, "category": "Other/Uncategorized", "neighborhood": "Brooklyn", "cuisine": "", "url": "https://www.google.com/maps/place/Wonderville/data=!4m2!3m1!1s0x89c25dbf7a0a5e67:0xa55f67b3268ab0e4"}, {"title": "Yesterday's News Antiques and Collectibles", "lat": 40.6792892, "lon": -73.9975798, "category": "Other/Uncategorized", "neighborhood": "Carroll Gardens", "cuisine": "", "url": "https://www.google.com/maps/place/Yesterday's+News+Antiques+and+Collectibles/data=!4m2!3m1!1s0x89c25a585c27fb4d:0xba69e28e2d3344b4"}, {"title": "Yesterday's", "lat": 40.6793516, "lon": -73.9974953, "category": "Shops/Retail", "neighborhood": "Carroll Gardens", "cuisine": "", "url": "https://www.google.com/maps/place/Yesterday's/data=!4m2!3m1!1s0x89c25974645dabc9:0x51af2b6fd8003e43"}, {"title": "Z\u00fcrcher Gallery", "lat": 40.7257429, "lon": -73.99380239999999, "category": "Galleries", "neighborhood": "NoHo", "cuisine": "", "url": "https://www.google.com/maps/place/Z%C3%BCrcher+Gallery/data=!4m2!3m1!1s0x89c2598569e3ccd7:0x30d6706ec6b3b8c"}, {"title": "abc carpet & home", "lat": 40.73824, "lon": -73.9898419, "category": "Shops/Retail", "neighborhood": "Union Square", "cuisine": "", "url": "https://www.google.com/maps/place/abc+carpet+%26+home/data=!4m2!3m1!1s0x89c259a22f66e37b:0x3fddb82236d24065"}, {"title": "abc carpet & home", "lat": 40.73824, "lon": -73.9898419, "category": "Shops/Retail", "neighborhood": "Union Square", "cuisine": "", "url": "https://www.google.com/maps/place/abc+carpet+%26+home/data=!4m2!3m1!1s0x89c25ab94a6ffc7f:0x5700dcb6afa9c931"}, {"title": "grace land new york", "lat": 40.7039931, "lon": -73.9051249, "category": "Shops/Retail", "neighborhood": "Ridgewood", "cuisine": "", "url": "https://www.google.com/maps/place/grace+land+new+york/data=!4m2!3m1!1s0x89c25da91dbd4617:0xeb9a13f14eecd5ec"}, {"title": "il Buco Vita", "lat": 40.7255667, "lon": -73.9915737, "category": "Shops/Retail", "neighborhood": "East Village", "cuisine": "", "url": "https://www.google.com/maps/place/il+Buco+Vita/data=!4m2!3m1!1s0x89c259853ea7e84b:0x2a630772cafdeaa3"}, {"title": "lensemble.us", "lat": 40.7032918, "lon": -73.9902797, "category": "Other/Uncategorized", "neighborhood": "Dumbo", "cuisine": "", "url": "https://www.google.com/maps/place/lensemble.us/data=!4m2!3m1!1s0x89c25bce9e851311:0xc32588a9150eacb8"}, {"title": "modernlink", "lat": 40.7260889, "lon": -73.9934406, "category": "Other/Uncategorized", "neighborhood": "NoHo", "cuisine": "", "url": "https://www.google.com/maps/place/modernlink/data=!4m2!3m1!1s0x89c2598540cce477:0xb09bd108398e8747"}, {"title": "myplasticheart", "lat": 40.7285588, "lon": -73.9588634, "category": "Shops/Retail", "neighborhood": "Greenpoint", "cuisine": "", "url": "https://www.google.com/maps/place/myplasticheart/data=!4m2!3m1!1s0x89c25984402d4433:0xe1bd36db9298b715"}, {"title": "tihngs", "lat": 40.7032797, "lon": -73.8977287, "category": "Other/Uncategorized", "neighborhood": "Ridgewood", "cuisine": "", "url": "https://www.google.com/maps/place/tihngs/data=!4m2!3m1!1s0x89c25daf0dfb80e5:0x623e95a92cdd7a7"}];
  const colors = {"Dining": "#e74c3c", "Coffee/Bakery": "#935116", "Bars/Nightlife": "#8e44ad", "Galleries": "#2980b9", "Museums/Cultural Institutions": "#16a085", "Arts/Studios/Event Spaces": "#d35400", "Shops/Retail": "#f1c40f", "Parks/Outdoors": "#27ae60", "Other/Uncategorized": "#7f8c8d"};
  const totalPlotted = 450;
  const failedCount = 0;
  const coreBbox = {"west": -74.26, "south": 40.48, "east": -73.68, "north": 40.92};

  const categories = [...new Set(places.map(p => p.category))].sort();
  const neighborhoods = [...new Set(places.map(p => p.neighborhood).filter(Boolean))].sort();
  const cuisines = [...new Set(places.map(p => p.cuisine).filter(Boolean))].sort();

  const map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  const clusterGroup = L.markerClusterGroup();
  clusterGroup.addTo(map);

  const activeCategories = new Set(categories);
  const activeNeighborhoods = new Set(neighborhoods);
  const activeCuisines = new Set(cuisines);

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  const markers = places.map(p => {
    const color = colors[p.category] || '#333';
    const marker = L.circleMarker([p.lat, p.lon], {
      radius: 7, color: color, fillColor: color, fillOpacity: 0.85, weight: 1,
    });
    const cuisineLine = p.cuisine ? `<br>${escapeHtml(p.cuisine)} cuisine` : '';
    const mapsLink = p.url
      ? `<br><a class="popup-link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">View on Google Maps</a>`
      : '';
    marker.bindPopup(`<b>${escapeHtml(p.title)}</b><br>${escapeHtml(p.category)}${cuisineLine}<br>${escapeHtml(p.neighborhood || '')}${mapsLink}`);
    return { marker, place: p };
  });

  // Cuisine only applies to places that have one (Dining) - a place with no
  // cuisine value is never hidden by the cuisine filter.
  function applyFilters() {
    const bounds = [];
    markers.forEach(({ marker, place }) => {
      const visible = activeCategories.has(place.category) &&
        (place.neighborhood === '' || activeNeighborhoods.has(place.neighborhood)) &&
        (place.cuisine === '' || activeCuisines.has(place.cuisine));
      if (visible) {
        if (!clusterGroup.hasLayer(marker)) clusterGroup.addLayer(marker);
        bounds.push([place.lat, place.lon]);
      } else if (clusterGroup.hasLayer(marker)) {
        clusterGroup.removeLayer(marker);
      }
    });
    return bounds;
  }

  // A few legitimately-geocoded places (e.g. upstate day trips) sit far
  // outside the city proper; including them in fitBounds would zoom out
  // so far that the dense in-city markers collapse into one cluster. Fit
  // to the places inside the location's core viewbox when possible - the
  // rest stay plotted and reachable by panning/zooming out manually.
  function inCoreBbox([lat, lon]) {
    if (!coreBbox) return true;
    return lon >= coreBbox.west && lon <= coreBbox.east &&
      lat >= coreBbox.south && lat <= coreBbox.north;
  }

  function refresh() {
    const bounds = applyFilters();
    const statsEl = document.getElementById('stats-count');
    if (statsEl) statsEl.textContent = `Showing ${bounds.length} of ${totalPlotted} places`;
    const coreBounds = bounds.filter(inCoreBbox);
    const fitTo = coreBounds.length ? coreBounds : bounds;
    if (fitTo.length) { map.fitBounds(fitTo, { padding: [30, 30] }); }
    else { map.setView([40.7128, -74.0060], 12); }
  }

  const FILTER_SEARCH_THRESHOLD = 12;

  function buildFilterGroup(title, items, activeSet, colorFor) {
    const div = L.DomUtil.create('div');
    const header = L.DomUtil.create('h4', '', div);
    header.innerHTML = `<span>${title}</span>`;
    const toggle = L.DomUtil.create('span', 'toggle-all', header);
    toggle.textContent = 'All / None';
    toggle.onclick = () => {
      const allOn = items.every(i => activeSet.has(i));
      items.forEach(i => allOn ? activeSet.delete(i) : activeSet.add(i));
      div.querySelectorAll('input').forEach(cb => cb.checked = !allOn);
      refresh();
    };
    if (items.length > FILTER_SEARCH_THRESHOLD) {
      const search = document.createElement('input');
      search.type = 'text';
      search.className = 'filter-search';
      search.placeholder = `Search ${title.toLowerCase()}...`;
      search.oninput = () => {
        const q = search.value.trim().toLowerCase();
        div.querySelectorAll('label').forEach(label => {
          label.style.display = label.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
      };
      div.appendChild(search);
    }
    items.forEach(item => {
      const label = L.DomUtil.create('label', '', div);
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.onchange = () => {
        if (cb.checked) activeSet.add(item); else activeSet.delete(item);
        refresh();
      };
      label.appendChild(cb);
      if (colorFor) {
        const sw = L.DomUtil.create('span', 'swatch', label);
        sw.style.background = colorFor(item);
      }
      label.appendChild(document.createTextNode(item));
    });
    return div;
  }

  const filterControl = L.control({ position: 'topright' });
  filterControl.onAdd = function() {
    // Starts collapsed; only the media query above hides the body, so this
    // is a no-op above 600px and the panel stays always-expanded there.
    const div = L.DomUtil.create('div', 'filters collapsed');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);

    const toggle = L.DomUtil.create('div', 'filters-toggle', div);
    L.DomUtil.create('span', '', toggle).textContent = 'Filters';
    L.DomUtil.create('span', 'chevron', toggle).textContent = '▾';
    toggle.onclick = () => div.classList.toggle('collapsed');

    const body = L.DomUtil.create('div', 'filters-body', div);

    // Search matches against ALL places regardless of active category/
    // neighborhood/cuisine filters (so "where's the place I saved called X"
    // always works, even if a filter is currently hiding it). Selecting a
    // result just temporarily shows that one marker via zoomToShowLayer -
    // it does NOT change filter state or checkbox UI, so the next filter
    // interaction (or a call to refresh()) will hide it again if it
    // doesn't match the active filters. This keeps search simple (no
    // syncing checkboxes to filter state) while never failing to find a
    // saved place by name.
    const searchWrap = L.DomUtil.create('div', 'search-wrap', body);
    const searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.className = 'search-input';
    searchInput.placeholder = 'Search places by name…';
    searchWrap.appendChild(searchInput);
    const searchResults = L.DomUtil.create('div', 'search-results', searchWrap);
    searchResults.style.display = 'none';

    function hideSearchResults() {
      searchResults.style.display = 'none';
      searchResults.innerHTML = '';
    }

    function selectSearchResult(place) {
      const entry = markers.find(m => m.place === place);
      if (!entry) return;
      if (!clusterGroup.hasLayer(entry.marker)) clusterGroup.addLayer(entry.marker);
      clusterGroup.zoomToShowLayer(entry.marker, () => entry.marker.openPopup());
      searchInput.value = '';
      hideSearchResults();
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) { hideSearchResults(); return; }
      const matches = places.filter(p => p.title.toLowerCase().includes(q)).slice(0, 8);
      searchResults.innerHTML = '';
      if (!matches.length) {
        const none = document.createElement('div');
        none.className = 'search-no-match';
        none.textContent = 'No matches';
        searchResults.appendChild(none);
      } else {
        matches.forEach(p => {
          const item = document.createElement('div');
          item.textContent = p.title;
          item.onclick = () => selectSearchResult(p);
          searchResults.appendChild(item);
        });
      }
      searchResults.style.display = 'block';
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        hideSearchResults();
        searchInput.blur();
      } else if (e.key === 'Enter') {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) return;
        const match = places.find(p => p.title.toLowerCase().includes(q));
        if (match) selectSearchResult(match);
      }
    });

    const stats = L.DomUtil.create('div', 'stats', body);
    stats.id = 'stats-count';
    stats.textContent = `Showing ${totalPlotted} of ${totalPlotted} places`;
    if (failedCount > 0) {
      const failedLine = L.DomUtil.create('div', 'stats failed', body);
      failedLine.textContent = `${failedCount} more failed to geocode (not shown)`;
    }
    body.appendChild(document.createElement('hr'));
    body.appendChild(buildFilterGroup('Category', categories, activeCategories, c => colors[c] || '#333'));
    body.appendChild(document.createElement('hr'));
    body.appendChild(buildFilterGroup('Neighborhood', neighborhoods, activeNeighborhoods, null));
    if (cuisines.length) {
      body.appendChild(document.createElement('hr'));
      body.appendChild(buildFilterGroup('Cuisine', cuisines, activeCuisines, null));
    }
    return div;
  };
  filterControl.addTo(map);

  refresh();
</script>
